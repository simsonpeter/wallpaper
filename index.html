<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TCW" />
    <meta name="application-name" content="TCW" />
    <meta name="theme-color" content="#0b0a08" />
    <title>TCW</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <main class="screen">
        <figure class="preview" id="preview">
          <img id="preview-image" alt="" hidden />
          <div class="preview-fallback" id="preview-fallback">
            <p class="fallback-ref" id="fallback-ref"></p>
            <blockquote id="fallback-text"></blockquote>
            <p class="fallback-note" id="fallback-note">Add a wallpaper link to preview this verse.</p>
          </div>
        </figure>

        <header class="app-bar">
          <div class="app-bar-actions">
            <button type="button" class="install-btn" id="install-btn" hidden>Install</button>
            <div class="segment" role="tablist" aria-label="Wallpaper orientation">
              <button type="button" class="orient is-active" data-orientation="landscape">Landscape</button>
              <button type="button" class="orient" data-orientation="portrait">Portrait</button>
            </div>
          </div>
        </header>

        <button type="button" class="nav-btn prev" id="prev-btn" aria-label="Previous verse">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 5 8 12l7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" class="nav-btn next" id="next-btn" aria-label="Next verse">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <section class="hud" aria-label="Wallpaper actions">
          <div class="verse-chip">
            <p id="verse-ref">Choose a verse</p>
            <p id="verse-text">Pick a verse to preview, download, or share.</p>
          </div>
        </section>

        <nav class="dock">
          <button type="button" class="dock-btn" id="verses-btn">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6h12M6 12h12M6 18h8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            Verses
          </button>
          <button type="button" class="dock-btn primary" id="download-btn" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4v11m0 0 4.5-4.5M12 15 7.5 10.5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Save
          </button>
          <button type="button" class="dock-btn" id="share-btn" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 12a3 3 0 1 1-3-3m3 3 8-4.5m0 0a3 3 0 1 1 3-3m-3 3v9.5a3 3 0 1 1-3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            Share
          </button>
        </nav>
      </main>

      <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
      <section class="sheet" id="sheet" aria-label="Choose verse" aria-hidden="true" inert>
        <button type="button" class="sheet-handle" id="sheet-close" aria-label="Close verse list"></button>
        <div class="sheet-head">
          <h1>Choose verse</h1>
          <a class="catalog-link" id="catalog-link" href="#" target="_blank" rel="noreferrer">Links</a>
        </div>
        <label class="search">
          <span class="sr-only">Search verses</span>
          <input id="search" type="search" placeholder="Search John 3:16..." enterkeyhint="search" />
        </label>
        <p class="status" id="status">Loading...</p>
        <ul class="verse-list" id="verse-list"></ul>
      </section>

      <p class="toast" id="toast" hidden></p>

      <div class="share-sheet" id="share-sheet" hidden>
        <p>Share</p>
        <button type="button" id="share-text-btn">Text only</button>
        <button type="button" id="share-image-btn">Image only</button>
        <button type="button" class="share-cancel" id="share-cancel-btn">Cancel</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
